name: Sync upstream main and tags

on:
  schedule:
    - cron: '0 3 * * *'   # 每天凌晨3点（UTC）运行
  workflow_dispatch:       # 手动触发也可以

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/langgenius/dify.git
          git fetch upstream --tags

      - name: Merge upstream/main into main
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "Nothing to merge"

      - name: Optional - exclude workflow files (uncomment if needed)
        # run: |
        #   git restore --staged .github/workflows/
        #   git checkout -- .github/workflows/

      - name: Push to origin
        run: |
          git push origin main
          git push origin --tags
